[package]
name = "apc-analysis"
description = "Cutaway analysis: ASR providers, aligner, take detection, room classification"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Local Parakeet ASR through sherpa-onnx (ONNX Runtime). Off by default; see DECISIONS.md D23.
parakeet = ["dep:sherpa-onnx", "dep:tar", "dep:bzip2"]

[dependencies]
apc-core.workspace = true
apc-media.workspace = true
apc-ai.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
blake3.workspace = true
dirs.workspace = true
ureq.workspace = true
sherpa-onnx = { version = "2.0.1", optional = true }
tar = { version = "0.4", optional = true }
bzip2 = { version = "0.6", optional = true }

[dev-dependencies]
tempfile.workspace = true
