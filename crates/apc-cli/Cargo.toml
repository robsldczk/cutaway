[package]
name = "apc-cli"
description = "Cutaway command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Local speech recognition, as in the desktop app (D46). `--no-default-features` builds without it.
default = ["parakeet"]
parakeet = ["apc-app/parakeet"]

[dependencies]
apc-core.workspace = true
apc-app.workspace = true
apc-export.workspace = true
apc-mcp.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap.workspace = true
rpassword = "7"

[dev-dependencies]
tempfile.workspace = true

# Synced from brand.json by scripts/rebrand.mjs
[[bin]]
name = "cutaway"
path = "src/main.rs"
