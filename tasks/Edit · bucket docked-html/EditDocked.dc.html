<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit · bucket docked</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D12}
a{color:#C3B7E6}a:hover{color:#DCD6E6}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ui{font-family:Figtree,system-ui,sans-serif;color:#F0EEE8}
.script{font-family:'Courier Prime','Courier New',monospace}
.nm{font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.glass{backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);background:rgba(255,255,255,0.04);box-shadow:inset 0 1px 0 rgba(255,255,255,0.09),inset 0 0 0 1px rgba(255,255,255,0.05),0 18px 50px rgba(0,0,0,0.35)}
.mut{color:rgba(240,238,232,0.64)}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,0.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.09);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(255,255,255,0.06);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.tab{height:36px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:500;color:rgba(240,238,232,0.68)}
.tabon{background:rgba(240,238,232,0.92);color:#14161C;font-weight:600}
.kb{display:inline-block;min-width:14px;text-align:center;font-size:10.5px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,0.1);color:rgba(240,238,232,0.85)}
.ib{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:rgba(240,238,232,0.75);flex:none}
.ibon{background:rgba(240,238,232,0.9);color:#14161C}
.lcd{display:flex;flex-direction:column;justify-content:center;height:40px;padding:0 16px;border-radius:12px;background:rgba(0,0,0,0.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06)}
.gh{position:absolute;left:0;top:0;bottom:0;width:100%;display:flex;align-items:flex-end;gap:8px;padding:0 0 4px 6px;box-sizing:border-box;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(240,238,232,0.62)}
.lh{position:absolute;left:0;top:0;bottom:0;width:160px;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;box-sizing:border-box;border-radius:10px;background:rgba(255,255,255,0.03)}
.ms{width:20px;height:20px;border-radius:6px;font-size:10px;font-weight:700;color:rgba(240,238,232,0.6);background:rgba(255,255,255,0.05)}
.clip{position:absolute;border-radius:8px;overflow:hidden;box-sizing:border-box}
.cw{position:absolute;left:0;top:0;width:100%;height:100%}
.cl{position:absolute;left:6px;right:6px;top:3px;font-size:10.5px;font-weight:600}
.si{position:absolute;padding:3px 7px;box-sizing:border-box;border-radius:7px;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bkt{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:rgba(255,255,255,0.035)}
.srow{display:grid;grid-template-columns:12px 28px minmax(0,1fr) 34px;gap:8px;align-items:center;height:40px;padding:0 6px;border-radius:12px;cursor:grab}
.play{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
@media (max-width:1100px){.panel{display:none}.tl{right:20px !important}}
</style>
</helmet>
<div class="ui" style="position: relative; width: 100%; height: 900px; overflow: hidden; background: radial-gradient(ellipse 55% 45% at 40% 50%, rgba(46,58,110,0.28), transparent 70%), #0B0D12">

<header style="position: absolute; top: 16px; left: 28px; right: 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; z-index: 10">
<div style="display: flex; align-items: baseline; gap: 10px; font-size: 13px"><span style="font-weight: 600">TARMAC Ep. 2</span><span class="mut">Sc. 2 · Canteen</span></div>
<nav class="glass" aria-label="Pages" style="display: flex; padding: 4px; border-radius: 999px">
<button class="tab">Import</button><button class="tab">Options</button><button class="tab">Arrange</button><button class="tab tabon">Edit</button>
</nav>
<div style="width: 120px"></div>
</header>

<section class="glass" aria-label="Control bar" style="position: absolute; top: 66px; left: 20px; right: 20px; height: 56px; box-sizing: border-box; border-radius: 20px; padding: 8px 10px; display: flex; align-items: center; gap: 6px; background: rgba(20,22,29,0.8)">
<button class="ib" aria-label="Inspector (I)" title="Inspector (I)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg></button>
<button class="ib" aria-label="Mixer (X)" title="Mixer (X)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="4" x2="6" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line><line x1="18" y1="4" x2="18" y2="20"></line><rect x="4" y="13" width="4" height="3" rx="1" fill="currentColor"></rect><rect x="10" y="7" width="4" height="3" rx="1" fill="currentColor"></rect><rect x="16" y="11" width="4" height="3" rx="1" fill="currentColor"></rect></svg></button>
<span style="width: 1px; height: 24px; background: rgba(255,255,255,0.1); margin: 0 6px"></span>
<div role="group" aria-label="Tools" style="display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: rgba(255,255,255,0.04)">
<button class="ib ibon" aria-label="Pointer (T)" title="Pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 3l14 8-6 2-2 6z"></path></svg></button>
<button class="ib" aria-label="Split" title="Split"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.1" y2="15.9"></line><line x1="14.5" y1="14.5" x2="20" y2="20"></line></svg></button>
<button class="ib" aria-label="Fade" title="Fade"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 20 Q10 4 21 4"></path></svg></button>
<button class="ib" aria-label="Gain" title="Gain"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><polyline points="3 16 9 10 14 13 21 6"></polyline></svg></button>
<button class="ib" aria-label="Marquee" title="Marquee"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 3" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect></svg></button>
</div>
<span style="flex: 1"></span>
<button class="ib" aria-label="Go to start"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="2.5" height="14" rx="1"></rect><path d="M19 5v14L9 12z"></path></svg></button>
<button aria-label="Play (Space)" style="width: 40px; height: 40px; border-radius: 50%; background: #F3F1EC; display: flex; align-items: center; justify-content: center; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#14161C"></path></svg></button>
<button class="ib ibon" aria-label="Cycle (C)" title="Cycle (C)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg></button>
<div class="lcd" style="margin: 0 6px"><span class="tn" style="font-size: 17px; font-weight: 600; line-height: 1">1:13.2</span><span class="mut" style="font-size: 10.5px; margin-top: 3px">Sc. 2 · Paul · take 3</span></div>
<span style="flex: 1"></span>
<button class="btn">Snap: words<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
<button class="btn" style="background: rgba(240,238,232,0.14)">Ripple</button>
<input type="range" min="1" max="10" value="4" aria-label="Zoom" style="width: 90px; accent-color: #F3F1EC">
<button class="btn" style="background: rgba(240,238,232,0.9); color: #14161C; box-shadow: none">Bucket <span class="kb" style="background: rgba(0,0,0,0.1); color: #14161C">B</span></button>
</section>

<section class="tl" aria-label="Timeline" style="position: absolute; top: 138px; left: 20px; right: 404px; height: 560px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<div style="position: absolute; left: 0; right: 0; {{r.style}}">
<sc-if value="{{r.isGroup}}" hint-placeholder-val="{{ false }}"><div class="gh"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>{{r.label}}</div></sc-if>
<sc-if value="{{r.isLane}}" hint-placeholder-val="{{ true }}">
<div class="lh" style="top: 2px; bottom: 2px"><span class="dot" style="background: {{r.col}}"></span><span class="ellip" style="flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600">{{r.label}}</span><button class="ms" aria-label="Mute {{r.label}}">M</button><button class="ms" aria-label="Solo {{r.label}}">S</button></div>
<div aria-hidden="true" style="position: absolute; left: 168px; right: 0; top: 2px; bottom: 2px; border-radius: 10px; background: rgba(255,255,255,0.018)"></div>
</sc-if>
<sc-if value="{{r.isScript}}" hint-placeholder-val="{{ false }}"><div class="lh" style="top: 2px; bottom: 2px; background: transparent"><span class="nm mut" style="font-size: 10px">Script</span></div></sc-if>
</div>
</sc-for>
<div style="position: absolute; left: 168px; right: 0; top: 0; bottom: 0; overflow: hidden">
<div aria-hidden="true" style="position: absolute; top: 2px; height: 14px; border-radius: 4px; background: rgba(240,238,232,0.22); left: {{cyx}}%; width: {{cyw}}%"></div>
<sc-for list="{{ticks}}" as="t" hint-placeholder-count="8"><span class="mut tn" style="position: absolute; top: 3px; font-size: 11px; padding-left: 4px; border-left: 1px solid rgba(255,255,255,0.15); height: 14px; line-height: 14px; left: {{t.x}}%">{{t.l}}</span></sc-for>
<sc-for list="{{strip}}" as="s" hint-placeholder-count="10"><span class="si script" style="{{s.style}}">{{s.t}}</span></sc-for>
<sc-for list="{{anchors}}" as="a" hint-placeholder-count="4"><span aria-hidden="true" style="position: absolute; width: 0; border-left: 1px dashed rgba(216,182,87,0.7); {{a.v}}"></span><span aria-hidden="true" style="position: absolute; width: 7px; height: 7px; margin: -3px 0 0 -3px; border-radius: 50%; background: #D8B657; {{a.d}}"></span></sc-for>
<sc-for list="{{clips}}" as="c" hint-placeholder-count="20">
<div class="clip" style="{{c.style}}"><svg class="cw" viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true"><path d="{{c.wave}}" fill="{{c.fill}}"></path></svg><span class="cl ellip" style="color: rgba(248,246,240,0.92)">{{c.label}}</span></div>
</sc-for>
<sc-for list="{{seams}}" as="m" hint-placeholder-count="2"><span aria-hidden="true" style="position: absolute; width: 1px; background: rgba(240,238,232,0.45); {{m.style}}"></span></sc-for>
<div style="position: absolute; top: 302px; height: 30px; border-radius: 8px; box-sizing: border-box; background: rgba(240,238,232,0.08); box-shadow: inset 0 0 0 1.5px rgba(240,238,232,0.45); overflow: hidden; left: {{gx}}%; width: {{gw}}%"><span class="cl ellip" style="color: rgba(248,246,240,0.8)">Burrito Bite Crunchy</span><span style="position: absolute; left: 0; bottom: 0; height: 3px; width: 64%; background: #D8B657"></span></div>
<div class="tn" style="position: absolute; top: 270px; padding: 5px 9px; border-radius: 9px; background: #F3F1EC; color: #14161C; font-size: 11px; font-weight: 600; white-space: nowrap; left: {{gx}}%">Downloading 64% · snaps to “Paul takes a bite.”</div>
<div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(240,238,232,0.4); left: {{scx}}%"></div>
<div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #F3F1EC; box-shadow: 0 0 10px rgba(240,238,232,0.6); left: {{phx}}%"><span style="position: absolute; top: 0; left: -5px; width: 12px; height: 12px; border-radius: 3px; background: #F3F1EC"></span></div>
</div>
</section>

<aside class="glass panel" aria-label="Bucket for scene 2" style="position: absolute; top: 138px; bottom: 16px; right: 16px; width: 372px; box-sizing: border-box; border-radius: 26px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: rgba(20,22,29,0.84)">
<div style="display: flex; align-items: center; gap: 6px"><span style="font-size: 15px; font-weight: 600; flex: 1">Bucket · Sc. 2</span>
<button class="btn" style="height: 30px">Full bucket <span class="kb">⇧B</span></button>
<button class="ib" aria-label="Hide bucket (B)" title="Hide (B)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg></button></div>
<div style="display: flex; align-items: center; gap: 14px; font-size: 11.5px" class="mut"><span style="display: flex; align-items: center; gap: 6px"><span class="dot" style="background: #D8B657"></span>Downloaded</span><span style="display: flex; align-items: center; gap: 6px"><span class="dot" style="box-shadow: inset 0 0 0 1.5px rgba(240,238,232,0.5)"></span>Preview, downloads on drop</span></div>
<div style="flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{buckets}}" as="b" hint-placeholder-count="4">
<section class="bkt" aria-label="{{b.name}}">
<div style="display: flex; align-items: center; gap: 8px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="opacity: 0.7; transform: rotate({{b.rot}}deg)"><polyline points="6 9 12 15 18 9"></polyline></svg><span style="font-size: 13px; font-weight: 600; flex: 1">{{b.name}}</span><span class="mut tn" style="font-size: 11px">{{b.count}}</span></div>
<sc-for list="{{b.rows}}" as="r" hint-placeholder-count="3">
<div class="srow" style="{{r.row}}">
<svg width="10" height="14" viewBox="0 0 10 14" fill="rgba(240,238,232,0.45)" aria-hidden="true"><circle cx="3" cy="3" r="1.2"></circle><circle cx="7" cy="3" r="1.2"></circle><circle cx="3" cy="7" r="1.2"></circle><circle cx="7" cy="7" r="1.2"></circle><circle cx="3" cy="11" r="1.2"></circle><circle cx="7" cy="11" r="1.2"></circle></svg>
<button class="play" aria-label="Play {{r.name}}" style="{{r.playStyle}}"><svg width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg></button>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 2px"><span class="ellip" style="font-size: 12px; {{r.nameStyle}}">{{r.name}}</span><svg viewBox="0 0 200 40" preserveAspectRatio="none" style="width: 100%; height: 14px" aria-hidden="true"><path d="{{r.d}}" fill="{{r.fill}}"></path></svg></div>
<span class="mut tn" style="font-size: 10.5px; text-align: right">{{r.dur}}</span>
</div>
</sc-for>
<sc-if value="{{b.more}}" hint-placeholder-val="{{ false }}"><button class="btn" style="height: 28px; font-size: 11.5px; align-self: flex-start">More like these</button></sc-if>
</section>
</sc-for>
</div>
</aside>
</div>
</x-dc>
