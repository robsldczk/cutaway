[package]
name = "cutaway-app"
description = "Cutaway desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cutaway_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Local speech recognition (Parakeet through sherpa-onnx, D23/D46). On for the desktop app.
default = ["parakeet"]
parakeet = ["apc-app/parakeet"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apc-core.workspace = true
apc-app.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
